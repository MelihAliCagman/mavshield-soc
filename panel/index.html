<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>İHA SOC Paneli</title>
<!--
  Derleme adımı olmadan (build-free) çalışan, tek dosyalık bir React paneli.
  backend/app.py'nin sunduğu /events, /ws ve /report uç noktalarına bağlanır.

  Çalıştırma:
    1) backend'i başlat:  uvicorn backend.app:app --port 8000
    2) bu dizini bir http sunucusuyla aç (WebSocket + fetch için file:// yetmez):
         python3 -m http.server 5500 --directory panel
       sonra tarayıcıda http://127.0.0.1:5500 adresini aç.
    İsteğe bağlı: ?backend=http://baska-host:8000 ile backend adresini değiştir.
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --panel-border: #22304a;
    --text: #e6edf7;
    --muted: #8291ab;
    --accent: #4fa3ff;
    --critical: #ff4d6d;
    --high: #ff9f45;
    --medium: #ffd166;
    --low: #6ad3a5;
    --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #root { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, #101a2e, #0d1627);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--low); box-shadow: 0 0 8px var(--low); }
  .dot.bad { background: var(--critical); box-shadow: 0 0 8px var(--critical); }

  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 16px 20px; }
  .tile {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .n { font-size: 26px; font-weight: 700; font-family: var(--mono); }
  .tile .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tile.critical .n { color: var(--critical); }
  .tile.high .n { color: var(--high); }
  .tile.medium .n { color: var(--medium); }
  .tile.low .n { color: var(--low); }

  main { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; padding: 0 20px 20px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .card h2 { font-size: 14px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--panel-border);
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

  .feed { overflow-y: auto; flex: 1; }
  .evt { padding: 10px 16px; border-bottom: 1px solid var(--panel-border);
    border-left: 3px solid var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .evt.critical { border-left-color: var(--critical); }
  .evt.high { border-left-color: var(--high); }
  .evt.medium { border-left-color: var(--medium); }
  .evt.low { border-left-color: var(--low); }
  .evt .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
  .evt .badge { font-weight: 700; text-transform: uppercase; }
  .evt.critical .badge { color: var(--critical); }
  .evt.high .badge { color: var(--high); }
  .evt.medium .badge { color: var(--medium); }
  .evt.low .badge { color: var(--low); }
  .evt .msg { font-size: 13px; }
  .empty { padding: 24px; color: var(--muted); font-size: 13px; text-align: center; }

  .report-body { padding: 14px 16px; overflow-y: auto; flex: 1; white-space: pre-wrap;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
  .report-footer { padding: 10px 16px; border-top: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 10px; }
  button {
    background: var(--accent); color: #06122a; border: none; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .src-badge { font-size: 11px; color: var(--muted); font-family: var(--mono); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;

function backendUrl() {
  const q = new URLSearchParams(location.search);
  return q.get("backend") || "http://127.0.0.1:8000";
}
function wsUrl(base) {
  return base.replace(/^http/, "ws") + "/ws";
}

const SEV_LABEL = { critical: "Kritik", high: "Yüksek", medium: "Orta", low: "Düşük" };

function fmtTime(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString("tr-TR", { hour12: false });
}

function StatTile({ sev, count }) {
  return h("div", { className: `tile ${sev}` },
    h("div", { className: "n" }, count),
    h("div", { className: "l" }, SEV_LABEL[sev] || sev));
}

function EventRow({ evt }) {
  return h("div", { className: `evt ${evt.severity}` },
    h("div", { className: "meta" },
      h("span", { className: "badge" }, evt.severity),
      h("span", null, fmtTime(evt.ts)),
      h("span", null, evt.rule),
      evt.source ? h("span", null, evt.source) : null),
    h("div", { className: "msg" }, evt.message));
}

function App() {
  const BACKEND = backendUrl();
  const [events, setEvents] = React.useState([]);
  const [connected, setConnected] = React.useState(false);
  const [report, setReport] = React.useState("Henüz rapor oluşturulmadı. Aşağıdaki butona basın.");
  const [reportSrc, setReportSrc] = React.useState(null);
  const [loadingReport, setLoadingReport] = React.useState(false);

  React.useEffect(() => {
    let active = true;
    fetch(`${BACKEND}/events?limit=200`).then(r => r.json()).then(data => {
      if (active) setEvents(data);
    }).catch(() => {});

    let ws;
    let retryTimer;
    function connect() {
      ws = new WebSocket(wsUrl(BACKEND));
      ws.onopen = () => setConnected(true);
      ws.onclose = () => { setConnected(false); retryTimer = setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
      ws.onmessage = (ev) => {
        try {
          const evt = JSON.parse(ev.data);
          setEvents(prev => [...prev.slice(-999), evt]);
        } catch (e) {}
      };
    }
    connect();
    return () => { active = false; clearTimeout(retryTimer); if (ws) ws.close(); };
  }, [BACKEND]);

  const counts = React.useMemo(() => {
    const c = { critical: 0, high: 0, medium: 0, low: 0 };
    for (const e of events) if (c[e.severity] !== undefined) c[e.severity]++;
    return c;
  }, [events]);

  const ordered = React.useMemo(() => [...events].reverse(), [events]);

  async function makeReport() {
    setLoadingReport(true);
    try {
      const r = await fetch(`${BACKEND}/report?limit=150`);
      const data = await r.json();
      setReport(data.report);
      setReportSrc(data.generated_by);
    } catch (e) {
      setReport("Rapor alınamadı: backend çalışıyor mu? (" + e + ")");
      setReportSrc(null);
    } finally {
      setLoadingReport(false);
    }
  }

  return h(React.Fragment, null,
    h("header", null,
      h("h1", null, h("span", null, "İHA"), " SOC Paneli"),
      h("div", { className: "status" },
        h("span", { className: `dot ${connected ? "ok" : "bad"}` }),
        connected ? "backend'e bağlı" : "bağlantı bekleniyor…",
        h("span", { style: { marginLeft: 10, opacity: .6 } }, BACKEND))),
    h("div", { className: "tiles" },
      h("div", { className: "tile" },
        h("div", { className: "n" }, events.length),
        h("div", { className: "l" }, "Toplam olay")),
      ["critical", "high", "medium", "low"].map(sev =>
        h(StatTile, { key: sev, sev, count: counts[sev] }))),
    h("main", null,
      h("div", { className: "card" },
        h("h2", null, "Canlı Olay Akışı"),
        h("div", { className: "feed" },
          ordered.length === 0
            ? h("div", { className: "empty" }, "Henüz olay yok. attacks/ altındaki bir betiği çalıştırın.")
            : ordered.map((e, i) => h(EventRow, { key: i, evt: e })))),
      h("div", { className: "card" },
        h("h2", null, "Yapay Zeka Destekli Rapor"),
        h("div", { className: "report-body" }, report),
        h("div", { className: "report-footer" },
          h("button", { onClick: makeReport, disabled: loadingReport },
            loadingReport ? "Oluşturuluyor…" : "AI Rapor Oluştur"),
          reportSrc ? h("span", { className: "src-badge" },
            reportSrc === "anthropic" ? "Claude tarafından üretildi"
              : reportSrc === "template" ? "Şablon (ANTHROPIC_API_KEY yok)"
              : "Şablona düşüldü (API hatası)") : null))));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
